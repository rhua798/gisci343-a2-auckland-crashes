<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive GIS dashboard exploring Auckland crash severity, pedestrian involvement and light conditions."
    />
    <title>Auckland Crash Severity Dashboard — Ruoxuan Huang</title>
    <script src="./shinylive/load-shinylive-sw.js" type="module"></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "python",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      :root {
        color: #172033;
        background: #f5f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fb;
      }

      .site-header {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px clamp(18px, 4vw, 56px);
        color: #ffffff;
        background: #123f73;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      }

      .eyebrow {
        margin: 0 0 2px;
        color: #b8d7f4;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.2rem);
        font-weight: 650;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .actions a {
        padding: 8px 12px;
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 650;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 999px;
      }

      .actions a:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      #root {
        min-height: 720px;
        height: calc(100vh - 64px);
        width: 100%;
      }

      .loading {
        display: grid;
        min-height: 50vh;
        place-items: center;
        color: #536176;
        text-align: center;
      }

      @media (max-width: 680px) {
        .site-header {
          align-items: flex-start;
          flex-direction: column;
        }

        #root {
          height: calc(100vh - 116px);
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">GISCI 343 · Interactive project</p>
        <h1>Auckland Crash Severity Dashboard</h1>
      </div>
      <nav class="actions" aria-label="Project links">
        <a href="https://github.com/rhua798/gisci343-a2-auckland-crashes">Source code</a>
        <a href="https://ruoxuan-huang-portfolio.huangruoxuan0208.chatgpt.site/projects">Portfolio</a>
      </nav>
    </header>
    <main id="root">
      <div class="loading">Loading the browser-based Python dashboard…</div>
    </main>
  </body>
</html>
